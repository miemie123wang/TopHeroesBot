name: Receive Task Gifts Once

on:
  workflow_dispatch:

jobs:
  receive-task-gifts:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          fi

      - name: Receive task gifts
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_KEY: ${{ secrets.APPS_SCRIPT_KEY }}
        run: node tools/receive-task-gifts-once.mjs --execute